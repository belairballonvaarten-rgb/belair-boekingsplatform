<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Belair-Fun — Boekingsplatform</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- LOGIN -->
<section id="view-login" class="view">
  <div class="login-box">
    <h1>Belair-Fun</h1>
    <p class="subtitel">Boekingsplatform — beheerscherm</p>
    <form id="form-login">
      <label>E-mail<input type="email" id="login-email" required autocomplete="username" /></label>
      <label>Wachtwoord<input type="password" id="login-wachtwoord" required autocomplete="current-password" /></label>
      <button type="submit">Inloggen</button>
      <p id="login-fout" class="foutmelding"></p>
    </form>
  </div>
</section>

<!-- APP SHELL -->
<div id="app-shell" class="view" hidden>
  <header class="topbar">
    <div class="logo">Belair-Fun</div>
    <nav>
      <button class="navbtn" data-view="aanvragen">Aanvragen-inbox <span id="badge-aanvragen" class="badge" hidden>0</span></button>
      <button class="navbtn" data-view="boekingen">Boekingenoverzicht</button>
      <button class="navbtn" data-view="nieuwe-boeking">+ Nieuwe boeking</button>
    </nav>
    <button id="btn-uitloggen" class="linkbtn">Uitloggen</button>
  </header>

  <main>
    <!-- AANVRAGEN-INBOX -->
    <section id="view-aanvragen" class="pagina">
      <h2>Aanvragen-inbox</h2>
      <p class="uitleg">Nieuwe aanvragen en aanvragen in behandeling — accepteer of weiger hier.</p>
      <div id="lijst-aanvragen" class="kaarten-lijst"></div>
    </section>

    <!-- BOEKINGENOVERZICHT -->
    <section id="view-boekingen" class="pagina" hidden>
      <h2>Boekingenoverzicht</h2>
      <div class="filterbalk">
        <label>Status
          <select id="filter-status">
            <option value="">Alle</option>
            <option value="nieuw">Nieuw</option>
            <option value="in_behandeling">In behandeling</option>
            <option value="geaccepteerd">Geaccepteerd</option>
            <option value="ingepland">Ingepland</option>
            <option value="bevestigd">Bevestigd</option>
            <option value="betaalverzoek_verstuurd">Betaalverzoek verstuurd</option>
            <option value="betaald_deels">Betaald (deels)</option>
            <option value="betaald_volledig">Betaald (volledig)</option>
            <option value="gefactureerd">Gefactureerd</option>
            <option value="geweigerd">Geweigerd</option>
          </select>
        </label>
        <label>Vanaf <input type="date" id="filter-vanaf" /></label>
        <label>Tot <input type="date" id="filter-tot" /></label>
        <button id="btn-filter-toepassen">Filteren</button>
      </div>
      <table class="tabel">
        <thead>
          <tr><th>Datum</th><th>Klant</th><th>Producten</th><th>Status</th><th>Adres</th><th></th></tr>
        </thead>
        <tbody id="tabel-boekingen"></tbody>
      </table>
    </section>

    <!-- NIEUWE BOEKING -->
    <section id="view-nieuwe-boeking" class="pagina" hidden>
      <h2>Nieuwe boeking aanmaken</h2>
      <form id="form-nieuwe-boeking">
        <fieldset>
          <legend>Klant</legend>
          <label>Zoek bestaande klant (naam, e-mail of telefoon)
            <input type="text" id="klant-zoek" placeholder="Typ om te zoeken..." />
          </label>
          <div id="klant-zoekresultaten" class="zoekresultaten"></div>
          <input type="hidden" id="klant-id" />
          <p id="klant-geselecteerd" class="geselecteerd" hidden></p>

          <details id="nieuwe-klant-details">
            <summary>Of maak een nieuwe klant aan</summary>
            <div class="grid-2">
              <label>Naam / bedrijfsnaam*<input type="text" id="nk-naam" /></label>
              <label>Type
                <select id="nk-type">
                  <option value="particulier">Particulier</option>
                  <option value="bedrijf">Bedrijf</option>
                </select>
              </label>
              <label>BTW-nummer (indien bedrijf)<input type="text" id="nk-btw" /></label>
              <label>Telefoon<input type="text" id="nk-telefoon" /></label>
              <label>E-mail<input type="email" id="nk-email" /></label>
              <label>Adres<input type="text" id="nk-adres" /></label>
              <label>Postcode<input type="text" id="nk-postcode" /></label>
              <label>Gemeente<input type="text" id="nk-gemeente" /></label>
            </div>
          </details>
        </fieldset>

        <fieldset>
          <legend>Periode</legend>
          <div class="grid-2">
            <label>Datum start*<input type="date" id="datum-start" required /></label>
            <label>Datum einde<input type="date" id="datum-einde" /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Producten</legend>
          <div id="producten-rijen"></div>
          <button type="button" id="btn-product-toevoegen" class="linkbtn">+ Product toevoegen</button>
          <p id="beschikbaarheid-melding" class="melding" hidden></p>
        </fieldset>

        <fieldset>
          <legend>Levering</legend>
          <div class="grid-2">
            <label>Leveringswijze
              <select id="leveringswijze">
                <option value="levering">Levering door ons team</option>
                <option value="afhaling">Afhaling door klant</option>
              </select>
            </label>
            <label>Plaatsingsadres<input type="text" id="leveringsadres" /></label>
            <label>Type ondergrond<input type="text" id="type-ondergrond" placeholder="bv. steen, gras" /></label>
            <label>Toegankelijkheid<input type="text" id="toegankelijkheid" placeholder="bv. vrije doorgang" /></label>
            <label>Voorkeur tijdstip levering<input type="text" id="voorkeur-levering" placeholder="bv. tussen 07:00-09:00" /></label>
            <label>Voorkeur tijdstip afhaling<input type="text" id="voorkeur-afhaling" placeholder="bv. tussen 17:00-19:00" /></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Overige</legend>
          <label>Notities / extra opmerkingen<textarea id="notities" rows="3"></textarea></label>
          <label class="checkbox"><input type="checkbox" id="huurvoorwaarden" /> Klant gaat akkoord met de huurvoorwaarden</label>
        </fieldset>

        <button type="submit">Boeking aanmaken</button>
        <p id="nieuwe-boeking-fout" class="foutmelding"></p>
        <p id="nieuwe-boeking-succes" class="succesmelding" hidden></p>
      </form>
    </section>

    <!-- BOEKING DETAIL (modal) -->
    <div id="modal-detail" class="modal" hidden>
      <div class="modal-inhoud">
        <button id="btn-modal-sluiten" class="modal-sluiten">&times;</button>
        <div id="modal-detail-inhoud"></div>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
</body>
</html>
